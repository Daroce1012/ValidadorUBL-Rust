[package]
name = "validador-ubl"
version = "0.1.0"
edition = "2021"
authors = ["Tu Nombre <tu@email.com>"]
description = "Validador de documentos UBL en formato XML"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Para parsing y validación de XML
quick-xml = "0.31"
# Para manejo de errores más elegante
anyhow = "1.0"
# Para WebAssembly
wasm-bindgen = "0.2"
# Para manejo de argumentos de línea de comandos (solo para binario)
clap = { version = "4.4", features = ["derive"], optional = true }
# Para validación XSD (usando xmllint)
roxmltree = "0.19"
# Para manejo de decimales precisos
rust_decimal = "1.34"
rust_decimal_macros = "1.34"
# Para manejo de fechas
chrono = "0.4"

[[bin]]
name = "validador-ubl"
required-features = ["cli"]

[features]
default = []
cli = ["clap"]